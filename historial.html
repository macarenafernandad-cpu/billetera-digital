<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Wallet - Historial de Transacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-primary fw-bold mb-0">📋 Historial de Transacciones</h3>
                    <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Volver al Menú</a>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Tipo de Operación</th>
                                <th>Detalle / Destinatario</th>
                                <th class="text-end">Monto</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                            <tr class="table-placeholder">
                                <td colspan="4" class="text-center text-muted py-4">No se han registrado transacciones aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>

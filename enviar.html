<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Wallet - Enviar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <div class="card-body">
                        <h3 class="mb-4 text-primary fw-bold">💸 Enviar Dinero</h3>
                        
                        <form id="sendForm">
                            <div class="mb-3">
                                <label for="recipientEmail" class="form-label fw-bold">Correo del Destinatario</label>
                                <input type="email" class="form-control" id="recipientEmail" placeholder="contacto@destino.com" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="sendAmount" class="form-label fw-bold">Monto a Enviar</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="sendAmount" min="1" placeholder="Ej: 10000" required>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Enviar Fondos</button>
                                <a href="dashboard.html" class="btn btn-outline-secondary">Volver al Menú</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>

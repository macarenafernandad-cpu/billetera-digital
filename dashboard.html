<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetera Digital - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">E-Wallet</a>
            <div class="justify-content-end">
                <span class="navbar-text text-white me-3" id="userNameDisplay">Bienvenido, Usuario</span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-12 col-md-6">
                <div class="card text-white bg-dark p-4 shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="text-uppercase opacity-75">Saldo Disponible</h6>
                        <h2 class="display-5 fw-bold my-3" id="balanceDisplay">$150.500</h2>
                        <p class="mb-0 text-success">● Cuenta Activa</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm border-0 h-100">
                    <h5 class="mb-4 fw-bold">Operaciones</h5>
                    <div class="d-grid gap-3">
                        <a href="depositar.html" class="btn btn-outline-primary py-3 fw-bold">
                            ➕ Depositar / Cargar Fondos
                        </a>
                        <a href="enviar.html" class="btn btn-outline-primary py-3 fw-bold">
                            💸 Enviar Dinero (Simulación)
                        </a>
                        <a href="historial.html" class="btn btn-outline-secondary py-3 fw-bold">
                            📋 Ver Historial de Transacciones
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>
